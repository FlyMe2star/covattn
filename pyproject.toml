[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "covattn"
version = "0.1.0"
requires-python = ">=3.10"
description = "Mechanistic diagnosis and training-free repair of covariate-effect attenuation in Chronos-2"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: needs the Chronos-2 weights (downloads from the HF hub)"]
